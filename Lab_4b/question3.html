<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Lab 4b - Question 3</title>
</head>
<body>
    <p id="demo"></p>

    <script>
        let text = "";

        // i goes from 0 to 4, so (i + 1) gives 1 to 5
        for (let i = 0; i < 5; i++) {
            text += "The number is " + (i + 1) + "<br>";
        }

        document.getElementById("demo").innerHTML = text;
    </script>
</body>
</html>
